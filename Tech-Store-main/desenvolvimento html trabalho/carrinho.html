<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Meu Carrinho</title>
    <link rel="stylesheet" href="carrinho.css">
</head>
<body>
    <a href="home.html" class="voltar">← Voltar</a>
    <header>
        <h1><a href="home.html" class="logo-link">Tech<span>Store</span></a></h1>
        <p>Meu Carrinho</p>
    </header>
    <nav class="menu">
        <a href="home.html">Início</a>
        <a href="sobre_nos.html">Sobre nós</a>
        <a href="celulares.html">Celulares</a>
        <a href="computadores.html">Computadores</a>
        <a href="acessorios.html">Acessórios</a>
        <a href="games.html">Games</a>
        <a href="promocoes.html">Promoções</a>
        <a href="minha_conta.html">👤 Minha conta</a>
        <a href="carrinho.html" class="active">🛒 Carrinho <span id="cartCount" class="cart-badge">0</span></a>
    </nav>
    <main class="container">
        <h2>🛒 Produtos no Carrinho</h2>
        <section class="carrinho" id="cartItems" aria-live="polite"></section>
        <section class="resumo">
            <h2>Resumo da compra</h2>
            <p>Subtotal: <span id="subtotal">R$ 0,00</span></p>
            <p>Frete: <span id="frete">R$ 0,00</span></p>
            <p class="total">Total: <span id="total">R$ 0,00</span></p>
            <button class="finalizar" id="finalizarCompra">Finalizar compra</button>
        </section>
    </main>
    <script src="carrinho.js"></script>
    <script>
      document.getElementById("finalizarCompra").addEventListener("click", function () {
        const cart = window.TechStoreCart.read();
        if (!cart.length) { alert("Seu carrinho está vazio."); return; }
        alert("Compra finalizada com sucesso! Esta é uma demonstração da loja.");
        window.TechStoreCart.save([]);
        window.TechStoreCart.render();
      });
    </script>
</body>
</html>
